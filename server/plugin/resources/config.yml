# Where things are in the Hyrule world. Hyrule's areas lie side by side, 1024 blocks
# apart: an area is centred on x = 1024 * its Zelda scene number and reaches about 500
# blocks either way; height 1024 is Zelda's zero.
hub:           # Kokiri Forest: players arrive here; nothing can be built or broken
  scene: 85
  x: 87038.5
  y: 1022.0
  z: 23.5
  yaw: -140
field:         # /field
  x: 82943.75
  y: 1024.0
  z: 33.0
  yaw: 180
# /go <name>: Hyrule's outdoor areas by Zelda scene number. Players arrive at the
# area's own entrance.
areas:
  field:    {scene: 81, title: Hyrule Field}
  kakariko: {scene: 82, title: Kakariko Village}
  graveyard: {scene: 83, title: Graveyard}
  river:    {scene: 84, title: Zora's River}
  kokiri:   {scene: 85, title: Kokiri Forest}
  meadow:   {scene: 86, title: Sacred Forest Meadow}
  lake:     {scene: 87, title: Lake Hylia}
  domain:   {scene: 88, title: Zora's Domain}
  fountain: {scene: 89, title: Zora's Fountain}
  valley:   {scene: 90, title: Gerudo Valley}
  woods:    {scene: 91, title: Lost Woods}
  colossus: {scene: 92, title: Desert Colossus}
  fortress: {scene: 93, title: Gerudo's Fortress}
  wasteland: {scene: 94, title: Haunted Wasteland}
  castle:   {scene: 95, title: Hyrule Castle}
  mountain: {scene: 96, title: Death Mountain Trail}
  crater:   {scene: 97, title: Death Mountain Crater}
  goron:    {scene: 98, title: Goron City}
  ranch:    {scene: 99, title: Lon Lon Ranch}
# Offered as links when someone tries to build in the hub.
featured-areas: [field, kakariko, lake, ranch, valley]
